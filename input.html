<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>車両データ入力</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f5f5;font-family:sans-serif;color:#333}h1{max-width:800px;margin:0 auto 20px}form{max-width:800px;margin:0 auto;padding:20px;background:#fff;border-radius:10px}.field{margin-bottom:18px}.field-title{display:block;margin-bottom:6px;font-weight:bold}input[type=text],select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:5px;background:#fff}input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:#555}textarea{min-height:120px;resize:vertical}.load-group{display:flex;gap:10px}.load-group select{width:45%}.load-group input{width:55%}.checkbox-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.checkbox-item{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid #ddd;border-radius:5px;background:#fafafa;cursor:pointer;font-weight:normal}.checkbox-item input{margin:0}.date-group{display:flex;align-items:center;gap:6px}.date-group select{width:auto;flex:1}.submit-button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:6px;background:#333;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.submit-button:hover{opacity:.85}.submit-button:disabled{opacity:.5;cursor:not-allowed}.message{display:none;max-width:800px;margin:15px auto 0;padding:12px;text-align:center;border-radius:6px;background:#e8f5e9}@media(max-width:600px){body{padding:10px}form{padding:15px}.load-group{flex-direction:column}.load-group select,.load-group input{width:100%}.date-group{gap:3px}.date-group select{min-width:0}}
</style>
</head>
<body>
<h1>車両データ入力</h1>
<form id="vehicleForm" action="https://script.google.com/macros/s/AKfycbwJ5HJ2XZA2lfhkKyPtnEPAyrfugFrF2-SDRzWRZXUZYX0a9l9pBd7qYSU7EyY3S-g/exec" method="POST" target="resultFrame">

<div class="field"><label class="field-title" for="class">クラス</label><select name="class" id="class"><option value="">選択してください</option><option value="TB">TB</option><option value="TC">TC</option><option value="TD">TD</option><option value="TE">TE</option><option value="TF">TF</option><option value="TG">TG</option><option value="TH">TH</option><option value="M">M</option></select></div>

<div class="field"><label class="field-title" for="maker">メーカー</label><select name="maker" id="maker"><option value="">選択してください</option><option value="いすゞ">いすゞ</option><option value="日野">日野</option><option value="三菱ふそう">三菱ふそう</option><option value="トヨタ">トヨタ</option><option value="日産">日産</option><option value="マツダ">マツダ</option></select></div>

<div class="field"><label class="field-title" for="model">車種名</label><select name="model" id="model" disabled><option value="">先にメーカーを選択してください</option></select></div>

<div class="field"><label class="field-title" for="year">年式</label><input type="text" name="year" id="year" placeholder="例：2024"></div>
<div class="field"><label class="field-title" for="transmission">A/M</label><input type="text" name="transmission" id="transmission" placeholder="例：5MT、AMT"></div>

<div class="field"><label class="field-title">積載量</label><div class="load-group"><select name="loadClass"><option value="">選択してください</option><option value="1tクラス">1tクラス</option><option value="2tクラス">2tクラス</option><option value="3tクラス">3tクラス</option><option value="4tクラス">4tクラス</option></select><input type="text" name="loadDetail" placeholder="詳細（例：2.0t）"></div></div>

<div class="field"><span class="field-title">架装</span><div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox" name="body" value="平">平</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="アルミ">アルミ</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ダンプ">ダンプ</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="クレーン">クレーン</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="積載車">積載車</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="冷凍車">冷凍車</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="パネル">パネル</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ウイング">ウイング</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ローダーダンプ">ローダーダンプ</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ショート">ショート</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="セミロング">セミロング</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ロング">ロング</label>
<label class="checkbox-item"><input type="checkbox" name="body" value="ワイド">ワイド</label>
</div></div>

<div class="field"><span class="field-title">キャビン</span><div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ローキャブ">ローキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ハイキャブ">ハイキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ワイドキャブ">ワイドキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ダブルキャブ">ダブルキャブ</label>
</div></div>

<div class="field"><span class="field-title">オプション</span><div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox" name="option" value="PG">PG</label>
<label class="checkbox-item"><input type="checkbox" name="option" value="コボレーン">コボレーン</label>
<label class="checkbox-item"><input type="checkbox" name="option" value="メッキ">メッキ</label>
<label class="checkbox-item"><input type="checkbox" name="option" value="電動サイド">電動サイド</label>
<label class="checkbox-item"><input type="checkbox" name="option" value="フォグ">フォグ</label>
<label class="checkbox-item"><input type="checkbox" name="option" value="フラットS.L.">フラットS.L.</label>
</div></div>

<div class="field"><label class="field-title" for="location">地名</label><select name="location" id="location"><option value="">選択してください</option><option value="袖ヶ浦">袖ヶ浦</option><option value="千葉">千葉</option><option value="大宮">大宮</option><option value="習志野">習志野</option><option value="所沢">所沢</option><option value="野田">野田</option><option value="成田">成田</option><option value="品川">品川</option><option value="多摩">多摩</option><option value="足立">足立</option><option value="川崎">川崎</option><option value="水戸">水戸</option><option value="横浜">横浜</option><option value="八王子">八王子</option></select></div>

<div class="field"><label class="field-title" for="numberClass">分類番号</label><input type="text" name="numberClass" id="numberClass" placeholder="例：400"></div>
<div class="field"><label class="field-title" for="number">車両番号</label><input type="text" name="number" id="number" placeholder="例：2828"></div>

<div class="field"><span class="field-title">目撃日</span><div class="date-group"><select name="sightingYear" id="sightingYear"><option value="">年</option></select><span>年</span><select name="sightingMonth" id="sightingMonth"><option value="">月</option></select><span>月</span><select name="sightingDay" id="sightingDay"><option value="">日</option></select><span>日</span></div></div>

<div class="field"><label class="field-title" for="sightingPlace">目撃場所</label><input type="text" name="sightingPlace" id="sightingPlace"></div>
<div class="field"><label class="field-title" for="office">所属営業所</label><input type="text" name="office" id="office"></div>
<div class="field"><label class="field-title" for="note">備考</label><textarea name="note" id="note"></textarea></div>

<button type="submit" class="submit-button" id="submitButton">送信</button>
</form>

<iframe name="resultFrame" id="resultFrame" style="display:none;"></iframe>
<div id="message" class="message">送信しました。</div>

<script>
const vehicleModels={"いすゞ":["エルフ","フォワード"],"日野":["デュトロ","レンジャー","リエッセ"],"三菱ふそう":["キャンター","ファイター","ローザ"],"トヨタ":["ダイナ","コースター"],"日産":["アトラス","シビリアン"],"マツダ":["タイタン"]};
const makerSelect=document.getElementById("maker");
const modelSelect=document.getElementById("model");
makerSelect.addEventListener("change",function(){modelSelect.innerHTML="";if(!this.value){const option=document.createElement("option");option.value="";option.textContent="先にメーカーを選択してください";modelSelect.appendChild(option);modelSelect.disabled=true;return;}const first=document.createElement("option");first.value="";first.textContent="選択してください";modelSelect.appendChild(first);vehicleModels[this.value].forEach(function(modelName){const option=document.createElement("option");option.value=modelName;option.textContent=modelName;modelSelect.appendChild(option);});modelSelect.disabled=false;});
const yearSelect=document.getElementById("sightingYear");const monthSelect=document.getElementById("sightingMonth");const daySelect=document.getElementById("sightingDay");
for(let year=2026;year<=2030;year++){const option=document.createElement("option");option.value=year;option.textContent=year;yearSelect.appendChild(option);}for(let month=1;month<=12;month++){const option=document.createElement("option");option.value=month;option.textContent=month;monthSelect.appendChild(option);}for(let day=1;day<=31;day++){const option=document.createElement("option");option.value=day;option.textContent=day;daySelect.appendChild(option);}
const form=document.getElementById("vehicleForm");const message=document.getElementById("message");const submitButton=document.getElementById("submitButton");const resultFrame=document.getElementById("resultFrame");
form.addEventListener("submit",function(){submitButton.disabled=true;submitButton.textContent="送信中...";form.dataset.submitted="true";});
resultFrame.addEventListener("load",function(){if(form.dataset.submitted!=="true")return;form.reset();modelSelect.innerHTML='<option value="">先にメーカーを選択してください</option>';modelSelect.disabled=true;submitButton.disabled=false;submitButton.textContent="送信";message.style.display="block";form.dataset.submitted="false";setTimeout(function(){message.style.display="none";},3000);});
</script>
</body>
</html>
