<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>車両検索</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#333}h1{max-width:1100px;margin:0 auto 20px}.search-form{max-width:1100px;margin:0 auto 25px;padding:20px;background:#fff;border-radius:10px}.field{margin-bottom:18px}.field-title{display:block;margin-bottom:6px;font-weight:bold}input[type=text],select{width:100%;padding:10px;font-size:16px;border:1px solid #aaa;border-radius:5px;background:#fff}.date-group{display:flex;align-items:center;gap:6px}.date-group select{width:auto;flex:1}.checkbox-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.checkbox-item{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid #ddd;border-radius:5px;background:#fafafa;cursor:pointer}.checkbox-item input{margin:0}.button-area{display:flex;gap:10px}button{flex:1;padding:14px;border:none;border-radius:6px;font-size:17px;font-weight:bold;cursor:pointer}#searchButton{background:#333;color:#fff}#clearButton{background:#ddd;color:#333}button:disabled{opacity:.5;cursor:not-allowed}#status{max-width:1100px;margin:0 auto 15px;text-align:center}.result-area{max-width:1100px;margin:0 auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}table{width:max-content;min-width:1600px;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid #ccc;text-align:left;vertical-align:top;white-space:nowrap}th{background:#eee}.no-result{padding:30px;background:#fff;text-align:center;border-radius:8px}@media(max-width:600px){body{padding:10px}.search-form{padding:15px}.button-area{flex-direction:column}.date-group{gap:3px}}
</style>
</head>
<body>
<h1>車両検索</h1>
<div class="search-form">
<div class="field"><label class="field-title" for="class">クラス</label><select id="class"><option value="">選択してください</option><option value="TB">TB</option><option value="TC">TC</option><option value="TD">TD</option><option value="TE">TE</option><option value="TF">TF</option><option value="TG">TG</option><option value="TH">TH</option><option value="M">M</option></select></div>
<div class="field"><label class="field-title" for="maker">メーカー</label><select id="maker"><option value="">選択してください</option><option value="いすゞ">いすゞ</option><option value="日野">日野</option><option value="三菱ふそう">三菱ふそう</option><option value="トヨタ">トヨタ</option><option value="日産">日産</option><option value="マツダ">マツダ</option></select></div>
<div class="field"><label class="field-title" for="model">車種名</label><select id="model" disabled><option value="">先にメーカーを選択してください</option></select></div>
<div class="field"><label class="field-title" for="year">年式（部分一致）</label><input type="text" id="year" placeholder="例：2024"></div>
<div class="field"><label class="field-title" for="transmission">A/M（部分一致）</label><input type="text" id="transmission" placeholder="例：AMT"></div>
<div class="field"><label class="field-title" for="loadClass">積載クラス</label><select id="loadClass"><option value="">選択してください</option><option value="1tクラス">1tクラス</option><option value="2tクラス">2tクラス</option><option value="3tクラス">3tクラス</option><option value="4tクラス">4tクラス</option></select></div>
<div class="field"><span class="field-title">架装（部分一致）</span><div class="checkbox-group">
    <label class="checkbox-item"><input type="checkbox" name="body" value="平">平</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="アルミ">アルミ</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ダンプ">ダンプ</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="クレーン">クレーン</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="積載車">積載車</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="冷凍車">冷凍車</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="パネル">パネル</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ウイング">ウイング</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ローダーダンプ">ローダーダンプ</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ショート">ショート</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="セミロング">セミロング</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ロング">ロング</label>
    <label class="checkbox-item"><input type="checkbox" name="body" value="ワイド">ワイド</label>
</div></div>
<div class="field"><span class="field-title">キャビン（部分一致）</span><div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ローキャブ">ローキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ハイキャブ">ハイキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ワイドキャブ">ワイドキャブ</label>
<label class="checkbox-item"><input type="checkbox" name="cabin" value="ダブルキャブ">ダブルキャブ</label>
</div></div>
<div class="field"><span class="field-title">オプション（部分一致）</span><div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox" name="option" value="PG">PG</label><label class="checkbox-item"><input type="checkbox" name="option" value="コボレーン">コボレーン</label><label class="checkbox-item"><input type="checkbox" name="option" value="メッキ">メッキ</label><label class="checkbox-item"><input type="checkbox" name="option" value="電動サイド">電動サイド</label><label class="checkbox-item"><input type="checkbox" name="option" value="フォグ">フォグ</label><label class="checkbox-item"><input type="checkbox" name="option" value="フラットS.L.">フラットS.L.</label>
</div></div>
<div class="field"><label class="field-title" for="location">地名</label><select id="location"><option value="">選択してください</option><option value="袖ヶ浦">袖ヶ浦</option><option value="千葉">千葉</option><option value="大宮">大宮</option><option value="習志野">習志野</option><option value="所沢">所沢</option><option value="野田">野田</option><option value="成田">成田</option><option value="品川">品川</option><option value="多摩">多摩</option><option value="足立">足立</option><option value="川崎">川崎</option><option value="水戸">水戸</option><option value="横浜">横浜</option><option value="八王子">八王子</option></select></div>
<div class="field"><label class="field-title" for="numberClass">分類番号（完全一致）</label><input type="text" id="numberClass"></div>
<div class="field"><label class="field-title" for="number">車両番号（完全一致）</label><input type="text" id="number"></div>
<div class="field"><span class="field-title">目撃日</span><div class="date-group"><select id="sightingYear"><option value="">年</option></select><span>年</span><select id="sightingMonth"><option value="">月</option></select><span>月</span><select id="sightingDay"><option value="">日</option></select><span>日</span></div></div>
<div class="field"><label class="field-title" for="sightingPlace">目撃場所（部分一致）</label><input type="text" id="sightingPlace"></div>
<div class="field"><label class="field-title" for="office">所属営業所（部分一致）</label><input type="text" id="office"></div>
<div class="button-area"><button type="button" id="searchButton">検索</button><button type="button" id="clearButton">条件クリア</button></div>
</div>
<div id="status"></div><div id="resultArea" class="result-area"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwJ5HJ2XZA2lfhkKyPtnEPAyrfugFrF2-SDRzWRZXUZYX0a9l9pBd7qYSU7EyY3S-g/exec';
const vehicleModels={'いすゞ':['エルフ','フォワード'],'日野':['デュトロ','レンジャー','リエッセ'],'三菱ふそう':['キャンター','ファイター','ローザ'],'トヨタ':['ダイナ','コースター'],'日産':['アトラス','シビリアン'],'マツダ':['タイタン']};
const makerSelect=document.getElementById('maker');const modelSelect=document.getElementById('model');
makerSelect.addEventListener('change',function(){modelSelect.innerHTML='';if(!this.value){const o=document.createElement('option');o.value='';o.textContent='先にメーカーを選択してください';modelSelect.appendChild(o);modelSelect.disabled=true;return;}const first=document.createElement('option');first.value='';first.textContent='選択してください';modelSelect.appendChild(first);vehicleModels[this.value].forEach(function(name){const o=document.createElement('option');o.value=name;o.textContent=name;modelSelect.appendChild(o)});modelSelect.disabled=false});
const yearSelect=document.getElementById('sightingYear'),monthSelect=document.getElementById('sightingMonth'),daySelect=document.getElementById('sightingDay');
for(let y=2026;y<=2030;y++){const o=document.createElement('option');o.value=y;o.textContent=y;yearSelect.appendChild(o)}for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m;monthSelect.appendChild(o)}for(let d=1;d<=31;d++){const o=document.createElement('option');o.value=d;o.textContent=d;daySelect.appendChild(o)}
function getCheckedValues(name){return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(c){return c.value}).join(',')}
function searchDatabase(){
 const status=document.getElementById('status'),resultArea=document.getElementById('resultArea'),button=document.getElementById('searchButton');
 status.textContent='検索中...';resultArea.innerHTML='';button.disabled=true;
 const callbackName='vehicleSearchCallback_'+Date.now();
 const params={action:'search',callback:callbackName,class:document.getElementById('class').value,maker:makerSelect.value,model:modelSelect.value,year:document.getElementById('year').value,transmission:document.getElementById('transmission').value,loadClass:document.getElementById('loadClass').value,body:getCheckedValues('body'),cabin:getCheckedValues('cabin'),option:getCheckedValues('option'),location:document.getElementById('location').value,numberClass:document.getElementById('numberClass').value,number:document.getElementById('number').value,sightingYear:yearSelect.value,sightingMonth:monthSelect.value,sightingDay:daySelect.value,sightingPlace:document.getElementById('sightingPlace').value,office:document.getElementById('office').value};
 const script=document.createElement('script');script.src=API_URL+'?'+new URLSearchParams(params).toString();let finished=false,timeoutId;
 window[callbackName]=function(data){if(finished)return;finished=true;clearTimeout(timeoutId);button.disabled=false;delete window[callbackName];if(!data||!data.success){status.textContent='検索に失敗しました。';script.remove();return}status.textContent=data.results.length+'台見つかりました。';displayResults(data.results);script.remove()};
 script.onerror=function(){if(finished)return;finished=true;clearTimeout(timeoutId);button.disabled=false;delete window[callbackName];status.textContent='検索に失敗しました。';script.remove()};
 timeoutId=setTimeout(function(){if(finished)return;finished=true;button.disabled=false;delete window[callbackName];script.remove();status.textContent='検索がタイムアウトしました。'},15000);
 document.head.appendChild(script);
}
function displayResults(results){
 const area=document.getElementById('resultArea');if(!results.length){area.innerHTML='<div class="no-result">該当する車両はありません。</div>';return}
 const headers=['クラス','メーカー','車種','年式','A/M','積載クラス','積載量','架装','キャビン','オプション','地名','分類番号','車両番号','目撃情報','所属営業所','備考'];
 let html='<table><thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>';
 results.forEach(function(v){html+='<tr><td>'+escapeHtml(v.class)+'</td><td>'+escapeHtml(v.maker)+'</td><td>'+escapeHtml(v.model)+'</td><td>'+escapeHtml(v.year)+'</td><td>'+escapeHtml(v.transmission)+'</td><td>'+escapeHtml(v.loadClass)+'</td><td>'+escapeHtml(v.loadDetail)+'</td><td>'+escapeHtml(v.body)+'</td><td>'+escapeHtml(v.cabin)+'</td><td>'+escapeHtml(v.option)+'</td><td>'+escapeHtml(v.location)+'</td><td>'+escapeHtml(v.numberClass)+'</td><td>'+escapeHtml(v.number)+'</td><td>'+escapeHtml(v.sightingInfo)+'</td><td>'+escapeHtml(v.office)+'</td><td>'+escapeHtml(v.note)+'</td></tr>'});
 html+='</tbody></table>';area.innerHTML=html;
}
function escapeHtml(value){if(value===null||value===undefined)return'';return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
document.getElementById('searchButton').addEventListener('click',searchDatabase);
document.getElementById('clearButton').addEventListener('click',function(){document.getElementById('class').value='';makerSelect.value='';modelSelect.innerHTML='<option value="">先にメーカーを選択してください</option>';modelSelect.disabled=true;document.getElementById('year').value='';document.getElementById('transmission').value='';document.getElementById('loadClass').value='';document.getElementById('location').value='';document.getElementById('numberClass').value='';document.getElementById('number').value='';yearSelect.value='';monthSelect.value='';daySelect.value='';document.getElementById('sightingPlace').value='';document.getElementById('office').value='';document.querySelectorAll('input[type="checkbox"]').forEach(function(c){c.checked=false});document.getElementById('status').textContent='';document.getElementById('resultArea').innerHTML=''})
</script>
</body>
</html>
